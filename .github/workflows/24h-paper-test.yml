name: 24-hour BTC paper-trading test

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  segment-1:
    name: Paper test — segment 1 of 5
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Run paper trader for about 4h 45m
        run: timeout --signal=INT --kill-after=30s 4h45m bitcoin-ai paper-run --state ./paper-state.json --initial-cash 100 --interval 1m --poll-seconds 60
      - uses: actions/upload-artifact@v4
        with:
          name: paper-state-1
          path: paper-state.json
          if-no-files-found: error
          retention-days: 3

  segment-2:
    name: Paper test — segment 2 of 5
    needs: segment-1
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: paper-state-1
      - run: pip install .
      - run: timeout --signal=INT --kill-after=30s 4h45m bitcoin-ai paper-run --state ./paper-state.json --initial-cash 100 --interval 1m --poll-seconds 60
      - uses: actions/upload-artifact@v4
        with:
          name: paper-state-2
          path: paper-state.json
          if-no-files-found: error
          retention-days: 3

  segment-3:
    name: Paper test — segment 3 of 5
    needs: segment-2
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: paper-state-2
      - run: pip install .
      - run: timeout --signal=INT --kill-after=30s 4h45m bitcoin-ai paper-run --state ./paper-state.json --initial-cash 100 --interval 1m --poll-seconds 60
      - uses: actions/upload-artifact@v4
        with:
          name: paper-state-3
          path: paper-state.json
          if-no-files-found: error
          retention-days: 3

  segment-4:
    name: Paper test — segment 4 of 5
    needs: segment-3
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: paper-state-3
      - run: pip install .
      - run: timeout --signal=INT --kill-after=30s 4h45m bitcoin-ai paper-run --state ./paper-state.json --initial-cash 100 --interval 1m --poll-seconds 60
      - uses: actions/upload-artifact@v4
        with:
          name: paper-state-4
          path: paper-state.json
          if-no-files-found: error
          retention-days: 3

  segment-5:
    name: Paper test — segment 5 of 5
    needs: segment-4
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: paper-state-4
      - run: pip install .
      - name: Final paper-trading segment
        run: timeout --signal=INT --kill-after=30s 4h45m bitcoin-ai paper-run --state ./paper-state.json --initial-cash 100 --interval 1m --poll-seconds 60
      - name: Generate final report
        run: bitcoin-ai paper-report --state ./paper-state.json --initial-cash 100 --interval 1m --json > paper-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: bitcoin-ai-24h-paper-results
          path: |
            paper-state.json
            paper-report.json
          if-no-files-found: error
          retention-days: 7
