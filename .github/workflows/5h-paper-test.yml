name: 5-hour BTC paper-trading test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitcoin-ai-5h-paper-test
  cancel-in-progress: false

jobs:
  five-hour-paper-test:
    name: 5-hour paper test — fake $100
    runs-on: ubuntu-latest
    timeout-minutes: 315
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bitcoin AI
        run: pip install .

      - name: Run paper trader for five hours
        shell: bash
        run: |
          set +e
          timeout --signal=INT --kill-after=30s 5h bitcoin-ai paper-run --state ./paper-state-5h.json --initial-cash 100 --interval 1m --poll-seconds 60
          code=$?
          if [ "$code" -ne 124 ] && [ "$code" -ne 0 ]; then
            echo "Paper trader exited unexpectedly with code $code"
            exit "$code"
          fi
          echo "Five-hour test window completed (timeout exit: $code)."

      - name: Generate final performance report
        if: always()
        run: |
          if [ -f paper-state-5h.json ]; then
            bitcoin-ai paper-report --state ./paper-state-5h.json --initial-cash 100 --interval 1m --json > paper-report-5h.json
          else
            echo '{"status":"no_state_file","note":"The paper trader did not create a state file."}' > paper-report-5h.json
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-ai-5h-paper-results
          path: |
            paper-state-5h.json
            paper-report-5h.json
          if-no-files-found: warn
          retention-days: 14
