name: BTC Historical Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Bitcoin AI
        run: python -m pip install .
      - name: Download long-history BTC/USDT daily candles from Binance public archive
        run: |
          python - <<'PY'
          import csv
          import io
          import time
          import urllib.request
          import zipfile
          from datetime import datetime, timezone
          
          base = "https://data.binance.vision/data/spot"
          now = datetime.now(timezone.utc)
          first_year, first_month = 2017, 8
          records = {}
          
          def fetch_archive(kind, period):
              name = f"BTCUSDT-1d-{period}.zip"
              url = f"{base}/{kind}/klines/BTCUSDT/1d/{name}"
              request = urllib.request.Request(url, headers={"User-Agent": "bitcoin-ai-research/1.0"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  payload = response.read()
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  csv_names = [item for item in archive.namelist() if item.lower().endswith(".csv")]
                  if not csv_names:
                      raise RuntimeError(f"No CSV found in {name}")
                  with archive.open(csv_names[0]) as source:
                      for row in csv.reader(io.TextIOWrapper(source, encoding="utf-8")):
                          if not row or not row[0].strip().isdigit():
                              continue  # skip optional header
                          open_ms = int(row[0])
                          close_ms = int(row[6]) if len(row) > 6 else open_ms + 86_400_000 - 1
                          if close_ms >= int(now.timestamp() * 1000):
                              continue  # never include an unfinished daily candle
                          close = float(row[4])
                          if close > 0:
                              records[open_ms] = close
          
          # Full annual archives keep the number of downloads small.
          for year in range(first_year + 1, now.year):
              try:
                  fetch_archive("annual", str(year))
                  print(f"Downloaded annual archive: {year}")
              except Exception as exc:
                  print(f"Annual archive {year} unavailable ({exc}); falling back to monthly files.")
                  for month in range(1, 13):
                      fetch_archive("monthly", f"{year}-{month:02d}")
          
          # 2017 begins partway through the year; current year uses completed months.
          for year, months in (
              (first_year, range(first_month, 13)),
              (now.year, range(1, now.month)),
          ):
              for month in months:
                  fetch_archive("monthly", f"{year}-{month:02d}")
          
          ordered = sorted(records.items())
          if len(ordered) < 906:
              raise SystemExit(f"Need at least 906 completed daily candles for six 90-bar OOS folds; found {len(ordered)}")
          
          with open("btc-daily.csv", "w", newline="", encoding="utf-8") as handle:
              writer = csv.writer(handle)
              writer.writerow(["timestamp", "close"])
              for open_ms, close in ordered:
                  stamp = datetime.fromtimestamp(open_ms / 1000, timezone.utc).isoformat()
                  writer.writerow([stamp, close])
          
          print(f"Saved {len(ordered)} completed Binance BTC/USDT daily candles.")
          print(f"History: {datetime.fromtimestamp(ordered[0][0] / 1000, timezone.utc).date()} to {datetime.fromtimestamp(ordered[-1][0] / 1000, timezone.utc).date()}")
          PY
      - name: Run walk-forward research and robustness checks
        run: |
          bitcoin-ai research-lab --csv btc-daily.csv --train-bars 365 --test-bars 90 --bootstrap-trials 1000 --json > research-report.json
      - name: Publish research summary
        run: |
          python - <<'PY'
          import json
          report = json.load(open("research-report.json", encoding="utf-8"))
          eligibility = report["paper_trial_eligibility"]
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("# Bitcoin AI — BTC historical research\\n\\n")
              out.write(f"- Folds: **{report['fold_count']}**\\n")
              out.write(f"- Out-of-sample returns: **{report['out_of_sample_returns']}**\\n")
              out.write(f"- Strategy OOS: **{report['out_of_sample_metrics']['total_return_pct']}%**\\n")
              out.write(f"- Buy-and-hold OOS: **{report['buy_and_hold_metrics']['total_return_pct']}%**\\n")
              out.write(f"- Strategy at 2x estimated costs: **{report['out_of_sample_metrics_at_2x_cost']['total_return_pct']}%**\\n")
              out.write(f"- Paper-forward trial eligibility: **{'ELIGIBLE' if eligibility['eligible'] else 'NOT ELIGIBLE'}**\\n\\n")
              out.write("## Out-of-sample performance by market regime\\n\\n")
              out.write("| Regime | Bars | Strategy | Buy & hold |\\n|---|---:|---:|---:|\\n")
              for regime, metrics in report["out_of_sample_regime_metrics"].items():
                  out.write(f"| {regime} | {metrics['observations']} | {metrics['strategy']['total_return_pct']}% | {metrics['buy_and_hold']['total_return_pct']}% |\\n")
              if eligibility["reasons"]:
                  out.write("\\n## Promotion gate findings\\n")
                  for reason in eligibility["reasons"]:
                      out.write(f"- {reason}\\n")
              out.write("\\nResearch only. Historical performance is not a forecast. No exchange orders are submitted.\\n")
          PY
      - name: Upload full research report and source candles
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-ai-btc-research
          path: |
            research-report.json
            btc-daily.csv
          retention-days: 30
