name: Bitcoin AI background paper trader

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bitcoin-ai-paper-trader
  cancel-in-progress: false

jobs:
  paper-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out persistent paper state
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Bitcoin AI
        run: pip install .
      - name: Run one safe paper-trading cycle
        run: python scripts/paper_tick.py
      - name: Publish virtual wallet state for the website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paper/state.json docs/status.json
          if git diff --cached --quiet; then
            echo "No state changes to publish."
          else
            git commit -m "Update scheduled paper-trading state"
            git push origin HEAD:main
          fi
